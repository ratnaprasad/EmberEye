[pytest]
addopts = -ra
# Integration profile intentionally targets environment-dependent tests.
# Expect external services/devices/UI stack to be available.
testpaths = tests
python_files = test_client.py test_parse_frame.py test_integration_e2e.py test_performance.py test_automated_validation.py test_send_commands.py
norecursedirs = .git .venv venv build dist windows_migration_v2 embereye-field
