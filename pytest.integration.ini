[pytest]
addopts = -ra
# Integration profile intentionally targets environment-dependent tests.
# Expect external services/devices/UI stack to be available.
testpaths = tests
# Keep integration profile focused on pytest-style integration modules.
# Exclude script-like harness files that execute at import time.
python_files = test_integration_e2e.py test_performance.py test_automated_validation.py
norecursedirs = .git .venv venv build dist windows_migration_v2 embereye-field
