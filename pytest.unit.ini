[pytest]
addopts = -ra --ignore=tests/test_client.py --ignore=tests/test_parse_frame.py --ignore=tests/test_logout.py --ignore=tests/test_ui_integration.py --ignore=tests/test_ui_workflows.py --ignore=tests/test_integration_e2e.py --ignore=tests/test_performance.py --ignore=tests/test_automated_validation.py --ignore=tests/test_send_commands.py
