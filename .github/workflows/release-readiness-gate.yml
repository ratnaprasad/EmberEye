name: Release Readiness Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  release-readiness-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install minimal dependencies for gate tests
        run: |
          pip install --upgrade pip
          pip install PyQt5 numpy opencv-python-headless websockets pillow bcrypt passlib cryptography

      - name: Run release readiness gate
        run: |
          python tests/field/run_release_readiness_gate.py --allow-missing-metrics

      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-report
          path: tests/artifacts/release_readiness_report.json
          if-no-files-found: warn
